<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GreenLog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#DCC8AA">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-512.png?v=2">
<title>GreenLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3D4A40; --ink2:#586558;
  --cream:#FBF6EA; --field:#FFFDF6; --cell:#EFE5D0;
  --sand:#DCC8AA; --sage:#8FA58A; --sage-d:#4F6857; --moss:#6F8A6B;
  --clay:#C48E72; --rose:#D3A39C; --mist:#93A9AD; --mus:#CBA95E;
  --shadow:rgba(61,74,64,.28);
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--sand);overflow-x:hidden}
body{margin:0;font-family:Calibri,Carlito,"Microsoft JhengHei","微軟正黑體","PingFang TC","Heiti TC","Noto Sans TC",system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;overflow-x:hidden;touch-action:manipulation}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
h1,h2,h3,p{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
.ill{display:block;flex:none;overflow:visible}
.lf{fill:var(--lf,#6F8A6B)} .lf2{fill:var(--lf2,#CBA95E)} .lfs{stroke:var(--lf,#6F8A6B)} .pot{fill:var(--pot,#C48E72)}

/* pages */
.page{min-height:100dvh;position:relative;overflow:hidden;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 40px)}
.page.tabbed{padding-bottom:calc(var(--sab) + 104px)}
.page>*{position:relative;z-index:2}
.page>.decor{position:absolute;z-index:0;pointer-events:none}
.bg-list{background:#C7D2BE} .bg-plant{background:#D9CBB3} .bg-ov{background:#D8C5BA} .bg-dex{background:#C3D0CF} .bg-home{background:#DCC8AA}

/* shared bits */
.card{background:var(--cream);border:2.5px solid var(--ink);border-radius:22px 26px 20px 28px/26px 20px 28px 22px;box-shadow:3px 4px 0 var(--shadow);padding:14px;margin-bottom:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top .sp{flex:1}
.ib{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:var(--cream);display:grid;place-items:center;padding:0;box-shadow:2px 3px 0 var(--shadow)}
.ib.sm{width:38px;height:38px;box-shadow:none}
.ib:active,.btn:active{transform:translateY(1px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:16px 20px 15px 21px/20px 15px 21px 16px;border:2.5px solid var(--ink);background:var(--sage-d);color:#FBF6EA;font-weight:700;box-shadow:2px 3px 0 var(--shadow)}
.btn.ghost{background:var(--cream);color:var(--ink)}
.btn.warn{background:#A9594F;color:#FBF6EA}
.btn.sm{min-height:38px;padding:5px 12px;font-size:15px}
.muted{color:var(--ink2)}
.hero{display:flex;align-items:center;justify-content:space-between;min-height:104px;margin:4px 0 14px}
.hero h1{font-size:30px;line-height:1.15}
.hero p{color:var(--ink);opacity:.85;margin-top:4px;font-size:15px}
.hero-ill{position:relative;width:132px;height:104px;flex:none}
.hero-ill .ill{position:absolute}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--cream);font-weight:700;font-size:15px}
.av{border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:var(--sage);display:grid;place-items:center;flex:none;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.dash{border-style:dashed;background:rgba(251,246,234,.55)}
.ch{display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.ch .ic{stroke:#fff;stroke-width:2.6}
.empty{text-align:center;padding:14px 6px;color:var(--ink2)}
.empty .pair{display:flex;justify-content:center;gap:4px;margin-bottom:4px}

.trow2{display:flex;align-items:center;gap:12px;position:relative;min-height:84px;margin-bottom:6px}
.tw{display:flex;align-items:baseline;gap:8px;min-width:0}
.pt{font-size:32px;font-weight:700;line-height:1.1;white-space:nowrap}
.cntw{font-size:19px;font-weight:700;color:#4F6857;white-space:nowrap}
.till{position:absolute;right:0;top:-6px;width:84px;height:84px;pointer-events:none}
.till .ill{position:absolute}
.act2{margin:2px 0 16px}
.ov .cd{min-height:52px}
.seg.sm{display:inline-flex;margin-top:12px;border-radius:14px}
.seg.sm button{flex:none;min-height:34px;padding:4px 16px;font-size:14px}
.mline{margin-top:10px;font-size:14px;font-weight:700;line-height:1.7}
.mlk{background:none;border:0;padding:4px 2px;font:inherit;color:var(--sage-d);text-decoration:underline;text-underline-offset:3px}
.dxbar{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
/* tab bar */
.tabs{position:fixed;left:14px;right:14px;bottom:calc(var(--sab) + 12px);z-index:30;display:flex;gap:4px;background:var(--cream);border:2.5px solid var(--ink);border-radius:28px;padding:5px;box-shadow:3px 4px 0 var(--shadow)}
.tabs button{flex:1;border:0;background:transparent;border-radius:22px;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;font-weight:700}
.tabs button.on{background:var(--sage-d);color:#FBF6EA}

/* home */
.home{display:flex;flex-direction:column;min-height:100dvh}
.home .blob{position:absolute;z-index:0;pointer-events:none}
.home .ttl{display:flex;align-items:center;justify-content:space-between;padding:20vh 0 0 21px}
.home h1{font-family:"Caveat Brush",cursive;font-weight:400;font-size:80px;line-height:1;color:#2F4536;transform:rotate(-3deg);transform-origin:left center;letter-spacing:1px;white-space:nowrap;flex:none}
.favs{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:10px 14px;width:322px;margin:48px auto 0}
.fav{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;width:98px}
.fav .fn{font-weight:700;font-size:15px;max-width:98px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav.empty .fn{color:var(--ink2);font-weight:400}
.hint{text-align:center;font-size:14px;color:var(--ink);margin-top:10px}
.hb{display:flex;justify-content:center;gap:14px;margin:18px 0 0;position:relative;z-index:3}
.hb button{flex:none;width:80px;background:var(--cream);border:2.5px solid var(--ink);border-radius:18px 22px 16px 24px/22px 16px 24px 18px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:14px;box-shadow:2px 3px 0 var(--shadow)}
.hb button .ico{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;color:#FBF6EA}

/* plant list */
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-h b{font-size:19px}
.sec-h .cnt{margin-left:auto;font-size:14px;color:var(--ink2)}
.sec-h .ico{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;color:#FBF6EA}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 6px}
.pi{background:none;border:0;padding:0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.pi .nm{font-weight:700;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .dy{font-size:13px;color:var(--ink2)}
.hb2{position:absolute;right:-4px;top:-4px;width:26px;height:26px;border-radius:50%;background:var(--rose);border:2px solid var(--ink);display:grid;place-items:center;color:var(--cream);z-index:3}
.avw{position:relative}

/* plant detail */
.phead{text-align:center;padding-top:16px}
.phead .row{display:flex;align-items:center;justify-content:center;gap:6px}
.phead h2{font-size:26px;margin-top:10px}
.phead .days{margin-top:8px}
.heartb{position:absolute;right:12px;top:12px;width:46px;height:46px;border-radius:50%;border:2.5px solid var(--ink);background:var(--cream);display:grid;place-items:center;color:var(--ink);padding:0}
.heartb.on{background:var(--rose);color:var(--cream)}
.seg{display:flex;border:2.5px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--cell)}
.seg button{flex:1;padding:10px 6px;border:0;background:transparent;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.seg button.on{background:var(--sage-d);color:#FBF6EA}
.h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acts button{border:2px solid var(--ink);border-radius:16px;background:var(--cell);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal.wk{margin-bottom:4px}
.cal.wk span{text-align:center;font-size:13px;font-weight:700;color:var(--ink2)}
.cd{min-height:64px;padding:3px 0 2px;border:2px solid transparent;border-radius:12px;background:var(--cell);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:14px;line-height:1.1;min-width:0}
.cd.today .dn{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--cream)}
.cd.sel{border-color:var(--ink);background:#E7D7A8}
.dis{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;width:36px}
.minis{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap}
.mini{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);overflow:hidden;background:var(--sage);margin-left:-5px;flex:none}
.mini:first-child{margin-left:0}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.more{font-size:10px;margin-left:2px;font-weight:700}
.dayp{margin-top:12px;padding-top:12px;border-top:2.5px dashed rgba(61,74,64,.45)}
.dayp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rec{display:flex;align-items:center;gap:10px;padding:8px 0}
.rec+.rec{border-top:1.5px dashed rgba(61,74,64,.3)}
.rec .t{flex:1;min-width:0}
.rec .t b{display:block}
.rec .t small{display:block;color:var(--ink2);font-size:14px;white-space:pre-wrap;word-break:break-word}
.xb{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--cream);display:grid;place-items:center;padding:0;flex:none}
.thumbs{display:flex;gap:8px;margin:2px 0 12px}
.thumbs .th{width:calc((100% - 24px)/4);aspect-ratio:1;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--cell)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.linkrow button{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--cell);font-weight:700}
.foot-info{text-align:center;font-size:14px;color:var(--ink);margin:6px 0 10px;opacity:.85}
.linkbtn{background:none;border:0;color:#8A3F37;font-weight:700;text-decoration:underline;padding:10px}

/* timeline */
.tl{position:relative;padding-left:28px}
.tl:before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:3px;background:var(--ink);opacity:.55;border-radius:2px}
.ti{position:relative;margin-bottom:18px}
.ti:before{content:"";position:absolute;left:-28px;top:4px;width:19px;height:19px;border-radius:50%;background:var(--sage-d);border:3px solid var(--ink)}
.ti .dt{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ti .dt b{font-size:17px}
.ti .dt span{font-size:14px;color:var(--ink2)}
.ti .ph{display:block;width:100%;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;padding:0;background:var(--cell)}
.ti .ph img{width:100%;display:block}
.ti .nt{margin-top:6px;white-space:pre-wrap;word-break:break-word}

/* overview */
.orow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--cell);border:2px solid var(--ink);border-radius:16px;padding:8px 10px;margin-top:8px}
.orow .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .cs{display:flex;gap:4px}

/* dex */
.search{display:block;width:100%;padding:11px 14px;border:2.5px solid var(--ink);border-radius:18px;background:var(--field);min-height:46px;margin-bottom:14px;-webkit-appearance:none;appearance:none}
.dx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--cream);border:2.5px solid var(--ink);border-radius:20px 24px 18px 26px/24px 18px 26px 20px;box-shadow:3px 4px 0 var(--shadow);padding:12px;margin-bottom:14px}
.dx .bd2{flex:1;min-width:0}
.dx .bd2 b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dx .bd2 small{display:block;color:var(--ink2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dx .minis{justify-content:flex-start;margin-top:6px}
.dx .mrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.dx .mrow small{white-space:nowrap}
.dx .mrow .minis{margin-top:0}
.dx .mini{width:22px;height:22px}
.dhead{text-align:center;padding-top:8px}
.dhead h2{font-size:26px;margin-top:10px}
.txt{white-space:pre-wrap;word-break:break-word}
.pr{display:flex;justify-content:space-between;gap:12px;padding:8px 0}
.pr+.pr{border-top:1.5px dashed rgba(61,74,64,.3)}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 6px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:100;display:none}
#sheet.on{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(40,48,42,.55);touch-action:none}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;background:var(--cream);border:3px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;display:flex;flex-direction:column;box-shadow:0 -4px 0 var(--shadow)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font-size:20px}
.sh-b{padding:4px 16px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.sh-f{display:flex;gap:10px;padding:10px 16px calc(var(--sab) + 12px);border-top:2.5px dashed rgba(61,74,64,.4);background:var(--cream)}
.sh-f .btn{flex:1}
.fl{display:block;margin:12px 0;font-weight:700;font-size:15px}
.fl input:not([type=checkbox]),.fl textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:2.5px solid var(--ink);border-radius:14px;background:var(--field);font-weight:400;min-height:46px;-webkit-appearance:none;appearance:none;text-align:left}
.fl textarea{min-height:92px;resize:none;line-height:1.5}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 4px;font-weight:700;font-size:15px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 4px}
.tg{border:2.5px solid var(--ink);border-radius:16px;background:var(--cell);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px;position:relative}
.tg.on{background:#E7D7A8;box-shadow:inset 0 0 0 2px var(--ink)}
.tg.on:after{content:"✓";position:absolute;right:6px;top:2px;font-size:15px}
.prow{display:flex;gap:8px;margin-top:8px}
.prow input{flex:1;min-width:0;padding:10px;border:2.5px solid var(--ink);border-radius:14px;background:var(--field);min-height:46px;-webkit-appearance:none;appearance:none}
.prow input.pp{flex:0 0 38%}
.chk{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--ink);border-radius:16px;background:var(--cell);margin-top:8px;font-weight:700}
.chk input{-webkit-appearance:checkbox;appearance:auto;width:26px;height:26px;min-height:0;padding:0;border:0;accent-color:var(--sage-d);flex:none;margin:0}
.chk:has(input:checked){background:#E7D7A8}
.chk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk small{font-weight:400;color:var(--ink2)}
.note-s{font-size:14px;color:var(--ink2);margin-top:8px;line-height:1.55}
#viewer{position:fixed;inset:0;z-index:120;background:rgba(30,36,32,.92);display:none;align-items:center;justify-content:center;padding:calc(var(--sat) + 12px) 12px calc(var(--sab) + 12px)}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 18px);transform:translateX(-50%);background:var(--ink);color:#FBF6EA;padding:10px 18px;border-radius:999px;z-index:200;font-weight:700;display:none;max-width:86vw;text-align:center}
#toast.on{display:block}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="viewer" data-act="closeViewer"></div>
<div id="toast"></div>

<script>
/* ============ 圖案（SVG sprite） ============ */
const SG="M44 66C40 48 30 38 20 16M36 48L14 42M28 32L36 12M20 16L12 7M20 16L27 6M50 64C50 46 48 32 50 10M50 40L38 30M50 32L62 22M50 10L44 3M50 10L57 3M56 66C60 48 70 38 80 16M64 48L86 42M72 32L64 12M80 16L88 7M80 16L73 6";
const POT=`<path class="pot" d="M29 68H71L66.5 95C66 98 64 99 61 99H39C36 99 34 98 33.5 95Z"/><rect class="pot" x="25" y="62" width="50" height="11" rx="5.5"/><path d="M30 67H70" stroke="#fff" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/><circle cx="42" cy="83" r="2.3" fill="#3D4A40"/><circle cx="58" cy="83" r="2.3" fill="#3D4A40"/><path d="M46.5 87.5Q50 91 53.5 87.5" fill="none" stroke="#3D4A40" stroke-width="2" stroke-linecap="round"/><ellipse cx="37" cy="87" rx="3.2" ry="2" fill="#F3B5AC" opacity=".85"/><ellipse cx="63" cy="87" rx="3.2" ry="2" fill="#F3B5AC" opacity=".85"/>`;
const SPRITE=`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-water" viewBox="0 0 24 24"><path d="M12 3C12 3 5 10.5 5 15a7 7 0 0 0 14 0C19 10.5 12 3 12 3z"/><path d="M9.5 15.5a2.6 2.6 0 0 0 2.2 2.4"/></symbol>
<symbol id="i-fert" viewBox="0 0 24 24"><path d="M7 9h10l1.2 11H5.8z"/><path d="M9 9V5.5h6V9"/><path d="M10 14.5h4"/></symbol>
<symbol id="i-prune" viewBox="0 0 24 24"><circle cx="6" cy="6.5" r="2.8"/><circle cx="6" cy="17.5" r="2.8"/><path d="M8.3 8L20 18M8.3 16L20 6"/></symbol>
<symbol id="i-divide" viewBox="0 0 24 24"><path d="M3 20.5h18"/><path d="M8 20.5V12M8 12C8 9 5.5 8 4 8c0 3 1.8 4 4 4zM16 20.5V10M16 10c0-3 2.5-4 4-4 0 3-1.8 4-4 4z"/></symbol>
<symbol id="i-repot" viewBox="0 0 24 24"><path d="M5 10h14l-1.8 10H6.8z"/><path d="M4 10h16"/><path d="M12 10V4.5M12 7.5c0-2 1.5-3 3-3 0 2-1.3 3-3 3z"/></symbol>

/* ============ 資料儲存（IndexedDB） ============ */
let S={plants:[],dex:[],mdex:[]};
const DBN='greenlog',STN='kv';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(STN);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(STN).objectStore(STN).get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbPut(v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(STN,'readwrite');t.objectStore(STN).put(v,'state');t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function loadState(){
  let d=null;
  try{d=await idbGet()}catch(e){}
  if(!d){try{d=JSON.parse(localStorage.getItem('greenlog')||'null')}catch(e){}}
  if(d&&typeof d==='object'){S={plants:Array.isArray(d.plants)?d.plants:[],dex:Array.isArray(d.dex)?d.dex:[],mdex:Array.isArray(d.mdex)?d.mdex:[]}}
  S.plants.forEach(p=>{p.logs=p.logs||[];p.photos=p.photos||[];p.method=p.method==='water'?'water':'soil';p.mediaIds=p.mediaIds||[];p.mediaText=p.mediaText||''});
  S.dex.forEach(x=>{x.plantIds=x.plantIds||[];x.prices=x.prices||[];x.mediaIds=x.mediaIds||[]});
  S.mdex.forEach(x=>{x.prices=x.prices||[]});
}

  try{await idbPut(S)}

}

/* ============ 圖片處理 ============ */
function shrink(file,max,square,q){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      try{
        const w=im.naturalWidth,h=im.naturalHeight;
        let sx=0,sy=0,sw=w,sh=h;
        if(square){const s=Math.min(w,h);sx=(w-s)/2;sy=(h-s)/2;sw=s;sh=s}
        const sc=Math.min(1,max/Math.max(sw,sh));
        const cw=Math.max(1,Math.round(sw*sc)),ch=Math.max(1,Math.round(sh*sc));
        const c=document.createElement('canvas');c.width=cw;c.height=ch;
        c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,cw,ch);
        res(c.toDataURL('image/jpeg',q));
      }catch(e){rej(e)}finally{URL.revokeObjectURL(u)}
    };
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};
    im.src=u;
  });
}

/* ============ 渲染 ============ */
function render(){
  const key=keyOf(location.hash);const [a,b,c]=key.split('/');
  let h;
  if(!a)h=vHome();
  else if(a==='list')h=vList();
  else if(a==='plant')h=c==='timeline'?vTimeline(b):vPlant(b);
  else if(a==='overview')h=vOverview();
  else if(a==='dex')h=b==='m'?vDexItem(c,'m'):b?vDexItem(b,'p'):vDex();
  else h=vHome();
  const same=key===lastKey,y=same?window.scrollY:(scrollMap[key]||0);
  lastKey=null;
  $('#app').innerHTML=h;
  window.scrollTo(0,y);
  lastKey=key;
  fitTitle();
}

}
/* 圖鑑表單 */
function priceRows(){return draft.prices.map((r,i)=>`<div class="prow"><input class="pm" value="${esc(r.m)}" placeholder="花市／店家" autocomplete="off"><input class="pp" value="${esc(r.p)}" placeholder="價格" inputmode="decimal" autocomplete="off"><button class="xb" style="width:46px;height:46px" data-act="delPrice" data-i="${i}" aria-label="移除">${icon('close',18)}</button></div>`).join('')}
function syncPrices(){const ms=$$('#pr-rows .pm'),ps=$$('#pr-rows .pp');draft.prices=ms.map((m,i)=>({m:m.value,p:ps[i].value}))}
function dexForm(id,k){
  k=k==='m'?'m':'p';const m=k==='m',noun=m?'介質':'植物';
  const x=id?getItem(id,k):null;
  draft={img:x?.img||'',prices:x?.prices?.length?x.prices.map(r=>({...r})):[{m:'',p:''}]};
  const linked=new Set(x?.plantIds||[]),lm=new Set(x?.mediaIds||[]);
  const plants=[...S.plants].sort(plantSort);
  openSheet(`${shHead((x?'編輯':'新增')+noun+'圖鑑')}
   <div class="sh-b">
    <label class="pick" for="f-img3">${pvBox(draft.img,104)}<span>點一下上傳圖片</span></label>
    <input id="f-img3" type="file" accept="image/*" hidden data-chg="deximg">
    <label class="fl">${noun}名稱<input id="d-name" value="${esc(x?.name||'')}" placeholder="${m?'例：培養土':'例：龜背芋'}" maxlength="30" autocomplete="off"></label>
    <label class="fl">特性<textarea id="d-traits" placeholder="${m?'例：保水透氣、偏酸':'例：喜歡明亮散射光，葉片會裂'}">${esc(x?.traits||'')}</textarea></label>
    <label class="fl">${m?'使用方式':'照護方式'}<textarea id="d-care" placeholder="${m?'例：搭配珍珠石 3:1，盆底先鋪石頭':'例：土乾透再澆水，夏天每週施肥一次'}">${esc(x?.care||'')}</textarea></label>
    <div class="fl">花市價格<div id="pr-rows">${priceRows()}</div><button class="btn ghost sm" style="margin-top:8px" data-act="addPrice">${icon('plus',16)}新增一筆價格</button></div>
    <label class="fl">備註<textarea id="d-note" placeholder="其他想記的事">${esc(x?.note||'')}</textarea></label>
    ${m?'':`<div class="fl">適合介質（可複選）
     ${S.mdex.length?S.mdex.map(md=>`<label class="chk">${avatar(md,40)}<span class="nm">${esc(md.name)}</span><input type="checkbox" name="lm" value="${md.id}" ${lm.has(md.id)?'checked':''}></label>`).join(''):'<p class="note-s">還沒有介質圖鑑，先到圖鑑的「介質」分頁新增吧</p>'}
    </div>
    <div class="fl">連結我的植物（可複選）
     ${plants.length?plants.map(p=>`<label class="chk">${avatar(p,40)}<span class="nm">${esc(p.name)}</span><small>${p.method==='water'?'水培':'土培'}</small><input type="checkbox" name="lp" value="${p.id}" ${linked.has(p.id)?'checked':''}></label>`).join(''):`<p class="note-s">還沒有植物可以連結，先去新增植物吧</p>`}
    </div>`}
   </div>
   <div class="sh-f"><button class="btn ghost" data-act="closeSheet">取消</button><button class="btn" data-act="saveDex" data-id="${id||''}" data-k="${k}">儲存</button></div>`);
}
/* 備份 */
function backupSheet(){
  openSheet(`${shHead('備份與搬家')}
   <div class="sh-b">
    <p class="note-s" style="margin-top:0">資料只存在這支手機的這個瀏覽器裡。建議用 Safari 的「分享 → 加入主畫面」後再使用，並定期匯出備份。主畫面版和 Safari 的資料是分開的，要搬過去請先匯出再匯入。</p>
    <div class="btnrow" style="margin-top:14px"><button class="btn" data-act="exportData">匯出備份</button><label class="btn ghost" for="f-imp" style="cursor:pointer">匯入備份</label></div>
    <input id="f-imp" type="file" accept=".json,application/json" hidden data-chg="import">
    <p class="note-s">目前共 ${S.plants.length} 株植物、${S.dex.length} 筆圖鑑。</p>
   </div>`);
}

/* ============ 動作 ============ */
const A={
  go:d=>go(d.to),
  back:d=>goBack(d.fb||''),
  closeSheet:()=>closeSheet(),
  closeViewer:()=>closeViewer(),
  backup:()=>backupSheet(),
  addPlant:()=>plantForm(''),
  editPlant:d=>plantForm(d.id),
  seg:(d,t)=>{draft.method=d.v;$$('#f-seg button').forEach(b=>b.classList.toggle('on',b===t));const fm=$('#f-media');if(fm)fm.style.display=d.v==='soil'?'':'none'},
  savePlant:d=>{
    const name=$('#f-name').value.trim(),date=$('#f-date').value;
    if(!name)return toast('請輸入名稱');
    if(!date)return toast('請選擇種植日期');
    const price=$('#f-price').value.trim();
    const mediaIds=$$('input[name=pm]:checked').map(i=>i.value),mediaText=($('#f-mtxt')?$('#f-mtxt').value:'').trim();
    if(d.id){const p=getPlant(d.id);Object.assign(p,{name,price,plantDate:date,avatar:draft.img,method:draft.method,mediaIds,mediaText})}
    else S.plants.push({id:uid(),name,price,plantDate:date,avatar:draft.img,method:draft.method,mediaIds,mediaText,fav:false,logs:[],photos:[]});
    persist();closeSheet();render();toast('已儲存');
  },
  toggleFav:()=>{const p=getPlant(ui.pid);if(!p)return;p.fav=!p.fav;persist();render();toast(p.fav?'已加入我的最愛':'已取消最愛')},
  setMethod:d=>{const p=getPlant(ui.pid);if(!p||p.method===d.v)return;p.method=d.v;persist();render();toast(d.v==='water'?'已改成水培':'已改成土培')},
  delPlant:d=>{
    const p=getPlant(d.id);if(!p)return;
    if(!confirm(`確定要刪除「${p.name}」嗎？紀錄和照片都會一起刪除。`))return;
    S.plants=S.plants.filter(x=>x.id!==d.id);S.dex.forEach(x=>{x.plantIds=x.plantIds.filter(i=>i!==d.id)});
    persist();nav=0;location.hash='#/list';
  },
  calNav:d=>{const k=+d.k;if(d.s==='d')ui.dm=shiftMonth(ui.dm,k);else ui.om=shiftMonth(ui.om,k);render()},
  calToday:d=>{if(d.s==='d'){ui.dm=today().slice(0,7);ui.dsel=today()}else{ui.om=today().slice(0,7);ui.osel=today()}render()},
  pickDay:d=>{if(d.s==='d')ui.dsel=d.d;else ui.osel=d.d;render()},
  addRec:d=>recForm(d.t||'',d.d||ui.dsel),
  tgType:(d,t)=>{if(draft.types.has(d.t))draft.types.delete(d.t);else draft.types.add(d.t);t.classList.toggle('on')},
  saveRec:()=>{
    const p=getPlant(ui.pid);if(!p)return;
    const date=$('#r-date').value,note=$('#r-note').value.trim();
    if(!draft.types.size)return toast('請至少選一個項目');
    if(!date)return toast('請選擇日期');
    if(draft.types.has('note')&&!note)return toast('選了備註，請寫點內容');
    [...draft.types].forEach(k=>p.logs.push({id:uid(),date,type:k,note:k==='note'?note:(draft.types.has('note')?'':note)}));
    ui.dsel=date;ui.dm=date.slice(0,7);
    persist();closeSheet();render();toast('已記錄');
  },
  delRec:d=>{const p=getPlant(ui.pid);if(!p)return;if(!confirm('刪除這筆紀錄？'))return;p.logs=p.logs.filter(l=>l.id!==d.id);persist();render()},
  addPhoto:()=>photoForm(),
  savePhoto:()=>{
    const p=getPlant(ui.pid);if(!p)return;
    const date=$('#p-date').value;
    if(!draft.img)return toast('請先選一張照片');
    if(!date)return toast('請選擇日期');
    p.photos.push({id:uid(),date,img:draft.img,note:$('#p-note').value.trim()});
    persist();closeSheet();render();toast('已新增照片');
  },
  delPhoto:d=>{const p=getPlant(ui.pid);if(!p)return;if(!confirm('刪除這張照片？'))return;p.photos=p.photos.filter(x=>x.id!==d.id);persist();render()},
  viewPhoto:d=>{const p=getPlant(ui.pid);const ph=p&&p.photos.find(x=>x.id===d.id);if(!ph)return;$('#viewer').innerHTML=`<img src="${ph.img}" alt="">`;$('#viewer').classList.add('on')},
  dexForm:d=>dexForm(d.id,d.k),
  dexTab:d=>{ui.dexTab=d.v==='m'?'m':'p';render()},
  addPrice:()=>{syncPrices();draft.prices.push({m:'',p:''});$('#pr-rows').innerHTML=priceRows()},
  delPrice:d=>{syncPrices();draft.prices.splice(+d.i,1);if(!draft.prices.length)draft.prices.push({m:'',p:''});$('#pr-rows').innerHTML=priceRows()},
  saveDex:d=>{
    const k=d.k==='m'?'m':'p';
    const name=$('#d-name').value.trim();
    if(!name)return toast('請輸入名稱');
    syncPrices();
    const data={name,img:draft.img,traits:$('#d-traits').value.trim(),care:$('#d-care').value.trim(),note:$('#d-note').value.trim(),
      prices:draft.prices.filter(r=>r.m.trim()||r.p.trim()).map(r=>({m:r.m.trim(),p:r.p.trim()}))};
    if(k==='p'){data.plantIds=$$('input[name=lp]:checked').map(i=>i.value);data.mediaIds=$$('input[name=lm]:checked').map(i=>i.value)}
    if(d.id)Object.assign(getItem(d.id,k),data);else col(k).push({id:uid(),...data});
    ui.dexTab=k;persist();closeSheet();render();toast('已儲存');
  },
  delDex:d=>{
    const k=d.k==='m'?'m':'p',x=getItem(d.id,k);if(!x)return;
    if(!confirm(`確定要刪除「${x.name}」嗎？`))return;
    if(k==='m'){S.mdex=S.mdex.filter(y=>y.id!==d.id);S.dex.forEach(y=>{y.mediaIds=(y.mediaIds||[]).filter(i=>i!==d.id)});S.plants.forEach(p=>{p.mediaIds=(p.mediaIds||[]).filter(i=>i!==d.id)})}
    else S.dex=S.dex.filter(y=>y.id!==d.id);
    ui.dexTab=k;persist();nav=0;location.hash='#/dex';
  },
  exportData:async()=>{
    const json=JSON.stringify({app:'GreenLog',v:1,exported:new Date().toISOString(),...S});
    const name=`greenlog-backup-${today()}.json`;
    try{
      const f=new File([json],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'GreenLog 備份'});return}
    }catch(e){if(e&&e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=A[t.dataset.act];if(f)f(t.dataset,t,e);
});
document.addEventListener('change',async e=>{
  const t=e.target,k=t.dataset&&t.dataset.chg;if(!k)return;
  const file=t.files&&t.files[0];if(!file)return;
  try{
    if(k==='avatar'||k==='deximg'){draft.img=await shrink(file,360,true,.82);setPv(draft.img)}
    else if(k==='photo'){draft.img=await shrink(file,1280,false,.74);const pv=$('#pv');if(pv){pv.style.width='100%';pv.style.height='auto';pv.style.borderRadius='18px';pv.innerHTML=`<img src="${draft.img}" alt="" style="max-height:260px;object-fit:contain">`}}
    else if(k==='import'){
      const d=JSON.parse(await file.text());
      if(!d||!Array.isArray(d.plants)||!Array.isArray(d.dex))throw new Error('format');
      if(!confirm(`匯入會取代目前的資料（${d.plants.length} 株植物、${d.dex.length} 筆圖鑑），確定嗎？`)){t.value='';return}
      S={plants:d.plants,dex:d.dex,mdex:Array.isArray(d.mdex)?d.mdex:[]};await loadStateFix();await doSave();closeSheet();render();toast('已匯入');
    }
  }catch(err){toast(k==='import'?'檔案格式不對，無法匯入':'圖片讀取失敗，請換一張')}
  t.value='';
});
async function loadStateFix(){S.plants.forEach(p=>{p.logs=p.logs||[];p.photos=p.photos||[];p.method=p.method==='water'?'water':'soil';p.plantDate=p.plantDate||today();p.mediaIds=p.mediaIds||[];p.mediaText=p.mediaText||''});S.dex.forEach(x=>{x.plantIds=x.plantIds||[];x.prices=x.prices||[];x.mediaIds=x.mediaIds||[]});S.mdex.forEach(x=>{x.prices=x.prices||[]})}
document.addEventListener('input',e=>{
  if(e.target.id!=='q')return;
  const q=e.target.value.trim().toLowerCase();let n=0;
  $$('#dxl .dx').forEach(el=>{const hit=!q||el.dataset.q.includes(q);el.style.display=hit?'':'none';if(hit)n++});
  $('#noq').style.display=n?'none':'block';
});
document.addEventListener('focusin',e=>{
  if(e.target.closest('#sheet')&&/INPUT|TEXTAREA/.test(e.target.tagName))setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}},320);
});

/* ============ 啟動 ============ */
(async()=>{
  await loadState();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  render();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTitle);
})();
</script>
</body>
</html>
